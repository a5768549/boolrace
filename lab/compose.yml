name: boolrace-lab
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    tmpfs:
      - /var/lib/mysql
    networks:
      - lab
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40
    # Intentionally NO host database port.
  web:
    build: .
    ports:
      - "127.0.0.1:8099:8099"
    networks:
      - lab
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 20
networks:
  lab:
    internal: true
