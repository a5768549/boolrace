name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Engine unit tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Offline lab safety tests
        run: python -m unittest discover -s lab -p 'test_*.py' -v
      - name: Syntax and Compose configuration
        run: |
          python -m compileall -q boolrace.py lab
          docker compose -f lab/compose.yml config --quiet
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-root
        # No host DB port. The fixture joins this private Docker network.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=3s --health-timeout=3s --health-retries=40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
      - name: Seed isolated MariaDB and start local web fixture
        env:
          DB_ID: ${{ job.services.db.id }}
        run: |
          docker exec -i "$DB_ID" mariadb -uroot -psynthetic-ci-root < lab/seed.sql
          network=$(docker inspect --format '{{range $name, $settings := .NetworkSettings.Networks}}{{$name}}{{end}}' "$DB_ID")
          test -n "$network"
          docker build --tag boolrace-lab-web ./lab
          docker run --detach --name boolrace-web --network "$network" \
            --publish 127.0.0.1:8099:8099 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true boolrace-lab-web
          python - <<'PY'
          import http.client
          import time
          for attempt in range(40):
              connection = http.client.HTTPConnection("127.0.0.1", 8099, timeout=2)
              try:
                  connection.request("GET", "/healthz")
                  response = connection.getresponse()
                  body = response.read()
                  if response.status == 200:
                      print(body.decode())
                      break
              except OSError:
                  pass
              finally:
                  connection.close()
              time.sleep(1)
          else:
              raise SystemExit("fixture did not become healthy")
          PY
      - name: Real CLI extraction, exact rows, CRC and report
        run: |
          python lab/smoke.py --mode union --out boolrace_out/ci-union
          python lab/smoke.py --mode compress --out boolrace_out/ci-compress
      - name: Show fixture diagnostics on failure
        if: failure()
        run: docker logs boolrace-web || true
      - name: Stop fixture
        if: always()
        run: docker rm -f boolrace-web || true
